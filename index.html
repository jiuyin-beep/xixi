<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>音频播放</title>

  <!--
    ★ 使用说明 ★
    1. 把你的音频文件命名为 audio.mp3 放到本目录（与 index.html 同级）。
       推荐 mp3 或 m4a（iOS/Android 都兼容）；避免 ogg（iPhone 不识别）和体积大的 wav。
    2. 如果文件名不同，修改下面 AUDIO_SRC 的值即可。
  -->
  <script>
    // ★ 在这里修改音频文件名（与 index.html 同目录）★
    const AUDIO_SRC = "audio.mp3";
    // 是否循环播放：true = 循环，false = 只播一次
    const LOOP = false;
  </script>

  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --accent: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .card {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .hint {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
      min-height: 20px;
    }
    .btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 40px rgba(34, 197, 94, 0.45);
      transition: transform 0.12s ease, box-shadow 0.2s ease;
      margin-bottom: 28px;
    }
    .btn:active { transform: scale(0.94); }
    .btn svg { width: 64px; height: 64px; }
    .btn.playing { background: #334155; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
    .icon-play { display: block; }
    .icon-pause { display: none; }
    .btn.playing .icon-play { display: none; }
    .btn.playing .icon-pause { display: block; }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #475569; border-radius: 24px;
      transition: 0.2s; cursor: pointer;
    }
    .slider::before {
      content: ""; position: absolute;
      width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">🎵 音频播放</div>
    <div class="hint" id="hint">点击播放</div>

    <button class="btn" id="playBtn" aria-label="播放/暂停">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l11-6.86a1.05 1.05 0 0 0 0-1.8l-11-6.86A1.05 1.05 0 0 0 8 5.14Z"/>
      </svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.8z"/>
      </svg>
    </button>

    <label class="row">
      <span class="switch">
        <input type="checkbox" id="loopToggle">
        <span class="slider"></span>
      </span>
      <span>循环播放</span>
    </label>
  </div>

  <audio id="audio" preload="auto" playsinline></audio>

  <script>
    const audio = document.getElementById("audio");
    const btn = document.getElementById("playBtn");
    const hint = document.getElementById("hint");
    const loopToggle = document.getElementById("loopToggle");

    audio.src = AUDIO_SRC;
    audio.loop = LOOP;
    loopToggle.checked = LOOP;

    function setPlaying(state) {
      btn.classList.toggle("playing", state);
      hint.textContent = state ? "播放中…" : "已暂停";
    }

    btn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => setPlaying(true));
    audio.addEventListener("pause", () => setPlaying(false));
    audio.addEventListener("ended", () => {
      if (!audio.loop) setPlaying(false);
    });

    loopToggle.addEventListener("change", () => {
      audio.loop = loopToggle.checked;
    });

    // 尝试自动播放（手机浏览器通常禁止带声音自动播放，失败则提示点击）
    audio.play().then(() => {
      setPlaying(true);
    }).catch(() => {
      hint.textContent = "点击下方按钮播放";
    });
  </script>
</body>
</html>
